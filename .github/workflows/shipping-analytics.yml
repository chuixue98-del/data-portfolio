# Runs on every pull request and push to main that touches the shipping project:
# lint, Python tests, then the full pipeline with all dbt tests on generated data.
name: shipping-analytics

on:
  pull_request:
    paths: ["shipping-analytics/**", ".github/workflows/shipping-analytics.yml"]
  push:
    branches: [main]
    paths: ["shipping-analytics/**", ".github/workflows/shipping-analytics.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shipping-analytics
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shipping-analytics/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        run: python -m pytest -q

      - name: Generate data
        run: python generator/generate_data.py

      # Two loads, so the snapshot has a change to record
      - name: Load the older merchant export and build
        run: |
          python ingest/load_raw.py --merchants-as-of 2026-10-31
          cd transform && dbt build --profiles-dir .

      - name: Load the newer merchant export and build again
        run: |
          python ingest/load_raw.py
          cd transform && dbt build --profiles-dir .
